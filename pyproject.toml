[project]
name = "zh"
version = "0.1.0"
description = "Local command journal and history browser"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
sync = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.115"]

[project.scripts]
zh = "zh.cli:main"
zh-server = "server.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["zh*", "server*"]

[tool.setuptools.package-data]
zh = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
